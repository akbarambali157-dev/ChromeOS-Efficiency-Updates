name: Mini-app validation

on:
  push:
    branches: [main]
    paths:
      - 'new-tab-launcher/**'
      - 'marketplace/catalogue/**'
      - 'scripts/**'
      - 'README.md'
      - '.github/workflows/mini-app-validation.yml'
  pull_request:
    paths:
      - 'new-tab-launcher/**'
      - 'marketplace/catalogue/**'
      - 'scripts/**'
      - 'README.md'
      - '.github/workflows/mini-app-validation.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find new-tab-launcher -type f -name '*.js' -print0)
      - name: Validate mini-app contracts
        run: node scripts/validate-miniapps.mjs
