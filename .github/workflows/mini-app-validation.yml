name: Mini-app validation

on:
  push:
    branches: [main]
    paths:
      - 'new-tab-launcher/**'
      - 'marketplace/catalogue/**'
      - 'scripts/**'
      - 'README.md'
      - '.github/workflows/mini-app-validation.yml'
  pull_request:
    paths:
      - 'new-tab-launcher/**'
      - 'marketplace/catalogue/**'
      - 'scripts/**'
      - 'README.md'
      - '.github/workflows/mini-app-validation.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find new-tab-launcher -type f -name '*.js' -print0)
      - name: Test Project Atlas diagnostics core
        run: node scripts/test-diagnostics-core.mjs
      - name: Test Project Atlas page and selector contracts
        run: node scripts/test-diagnostics-page-contracts.mjs
      - name: Test shared AI response normalization and continuation
        run: node scripts/test-ai-response.mjs
      - name: Test provider-specific model effort capabilities
        run: node scripts/test-model-effort.mjs
      - name: Test scoped project folder tool adapter
        run: node scripts/test-project-tools.mjs
      - name: Test Parallel Search response handling
        run: node scripts/test-parallel-search.mjs
      - name: Test project folder safety and path boundaries
        run: node scripts/test-project-folders.mjs
      - name: Test project-folder search byte-budget regressions
        run: node scripts/test-project-search.mjs
      - name: Test workspace startup and note-save reliability
        run: node scripts/test-workspace-reliability.mjs
      - name: Test Creative Library validation and privacy contracts
        run: node scripts/test-creative-library.mjs
      - name: Test Recreation Lab structure and privacy contracts
        run: node scripts/test-recreation-lab.mjs
      - name: Validate mini-app contracts
        run: node scripts/validate-miniapps.mjs
